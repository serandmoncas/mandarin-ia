[project]
name = "mandarin-pipeline"
version = "0.1.0"
description = "Content pipeline for the mandarin-ia dictionary"
requires-python = ">=3.12"
dependencies = [
  "wordfreq[cjk]>=3.1",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pypinyin>=0.55.0",
  "jieba>=0.42.1",
  "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mandarin_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
